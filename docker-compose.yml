services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: machi01_mongo
    ports:
      - "27001:27017"
    command: [ "mongod", "--quiet" ]
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGODB_INITDB_DATABASE=machi01_shad
    networks:
      - machi01-network
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: machi01_backend:latest
    container_name: machi01_backend
    ports:
      - "4001:4000" # Host 4001, Container 4000 (standard for express in our setup)
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - machi01-network
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: machi01_frontend:latest
    container_name: machi01_frontend
    ports:
      - "3001:80" # Nginx/Static host on 80
    networks:
      - machi01-network
    restart: always

networks:
  machi01-network:
    driver: bridge

volumes:
  mongodb_data:
